name: Build AX1800Pro Firmware

on:
  workflow_dispatch:
    inputs:
      TEST:
        description: '仅测试配置（不下载、不编译）'
        type: boolean
        default: false
      RELEASE:
        description: '上传到滚动 Release (latest-qf)'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'
# 注：push 到 main 不会自动构建（编译要 3 小时），日常改动手动 workflow_dispatch 触发

permissions:
  contents: write

env:
  REPO: j55455/ax1800pro-firmware
  REPO_URL: https://github.com/LiBwrt/LibWrt
  REPO_BRANCH: 25.12-nss
  WRT_DIR: openwrt
  DEVICE_NAME: jdcloud_re-ss-01
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -yqq update
          sudo -E apt-get -yqq install ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler dos2unix fastjar flex \
            gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp \
            nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd libfuse-dev jq bc
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          echo "WRT_DATE=$(TZ=Asia/Shanghai date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
          echo "BUILD_DAY=$(TZ=Asia/Shanghai date +'%Y.%m.%d')" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Clone Source
        run: |
          git clone --depth=1 --single-branch --branch "$REPO_BRANCH" "$REPO_URL" "$WRT_DIR"
          cd "$WRT_DIR"
          echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV
          # 海外 runner 上剔除国内镜像重定向，避免超时
          if [ -f "./scripts/projectsmirrors.json" ]; then
            sed -i '/\.cn\//d; /tencent/d; /aliyun/d' "./scripts/projectsmirrors.json"
          fi

      - name: Merge Custom Files
        run: |
          cd "$WRT_DIR"
          find "$GITHUB_WORKSPACE/scripts" -type f -exec dos2unix {} \; -exec chmod +x {} \;
          find "$GITHUB_WORKSPACE/files" -type f -exec dos2unix {} \;
          for d in "$GITHUB_WORKSPACE/files/etc/init.d" "$GITHUB_WORKSPACE/files/etc/hotplug.d" \
                   "$GITHUB_WORKSPACE/files/etc/uci-defaults" "$GITHUB_WORKSPACE/files/usr/sbin" \
                   "$GITHUB_WORKSPACE/files/usr/bin"; do
            [ -d "$d" ] && find "$d" -type f -exec chmod +x {} \;
          done
          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            mkdir -p files
            cp -rf "$GITHUB_WORKSPACE/files/." files/
            echo "[INFO] files/ merged into rootfs"
          fi

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WRT_DIR }}/.ccache
            ${{ env.WRT_DIR }}/staging_dir
          key: ${{ runner.os }}-ipq60xx-${{ env.REPO_BRANCH }}-${{ hashFiles('configs/**', 'scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-ipq60xx-${{ env.REPO_BRANCH }}-
            ${{ runner.os }}-ipq60xx-

      - name: Update & Install Feeds
        run: |
          cd "$WRT_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare Custom Packages
        run: |
          cd "$WRT_DIR"
          bash "$GITHUB_WORKSPACE/scripts/01-prepare-packages.sh"

      - name: Generate Config & Factory Settings
        run: |
          set -eo pipefail
          cd "$WRT_DIR"

          source "$GITHUB_WORKSPACE/scripts/function.sh"
          generate_config

          bash "$GITHUB_WORKSPACE/scripts/02-custom-settings.sh"

          make defconfig -j$(nproc)

          echo "===== defconfig 之后的关键配置闸门 ====="
          fail=0
          hard() { if grep -qE "$1" .config; then echo "OK:   $1"; else echo "FAIL: $1"; fail=1; fi; }
          soft() { if grep -qE "$1" .config; then echo "OK:   $1"; else echo "WARN: $1 (可接受, 继续)"; fi; }

          # HARD：机型 / 内存 profile / NSS / 三类插件 / 主题 / 透明代理底层
          hard '^CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y'
          hard '^CONFIG_IPQ_MEM_PROFILE_1024=y'
          hard '^CONFIG_ATH11K_MEM_PROFILE_1G=y'
          hard '^CONFIG_KERNEL_SKB_RECYCLER=y'
          hard '^CONFIG_PACKAGE_kmod-qca-nss-drv=y'
          hard '^CONFIG_PACKAGE_kmod-qca-nss-ecm=y'
          hard '^CONFIG_PACKAGE_luci-app-oxidns=y'
          hard '^CONFIG_KERNEL_DEBUG_INFO_BTF=y'
          hard '^CONFIG_PACKAGE_kmod-sched-bpf=y'
          hard '^CONFIG_PACKAGE_nikki=y'
          hard '^CONFIG_PACKAGE_luci-app-nikki=y'
          hard '^CONFIG_PACKAGE_luci-theme-kucat=y'
          hard '^CONFIG_PACKAGE_luci-app-samba4=y'
          hard '^CONFIG_PACKAGE_kmod-tun=y'
          hard '^CONFIG_PACKAGE_kmod-nft-tproxy=y'

          # SOFT：增强项
          soft '^CONFIG_PACKAGE_luci-app-kucat-config=y'
          soft '^CONFIG_PACKAGE_mihomo=y'
          soft '^CONFIG_PACKAGE_kmod-nft-fullcone=y'
          soft '^CONFIG_PACKAGE_dnsmasq-full=y'
          soft '^CONFIG_PACKAGE_kmod-zram=y'
          soft '^CONFIG_PACKAGE_zram-swap=y'

          [ "$fail" -eq 0 ] || { echo "ERROR: defconfig 后关键配置丢失, 中止构建" >&2; exit 1; }
          echo "===== 闸门校验通过 ====="

      - name: Download Package Sources
        if: ${{ inputs.TEST != true }}
        run: |
          cd "$WRT_DIR"
          make download -j$(nproc) || make download -j1 V=s
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        if: ${{ inputs.TEST != true }}
        run: |
          cd "$WRT_DIR"
          echo -e "[INFO] 开始并发编译 (核数: $(nproc))..."
          if make -j$(nproc); then
            echo "COMPILE_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "===== 并发编译失败，改用单线程 V=s 重跑以拿到确切报错位置 =====" >&2
            make -j1 V=s
            echo "COMPILE_SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Post-Build Assertions
        if: ${{ inputs.TEST != true }}
        run: |
          set -e
          cd "$WRT_DIR"
          BIN=./bin/targets/qualcommax/ipq60xx
          echo "===== 编译产物闸门校验 (post-build) ====="

          # 1) sysupgrade 镜像必须存在
          ls "$BIN"/*jdcloud_re-ss-01*sysupgrade* >/dev/null 2>&1 || { echo "ERROR: 未生成 sysupgrade 镜像"; exit 1; }

          # 2) 独立内核镜像若存在，不得超过 12MB 上限
          KIMG=$(find "$BIN" -maxdepth 1 -type f \( -name "*-kernel.bin" -o -name "*-uImage" -o -name "kernel" \) | head -n 1)
          if [ -n "$KIMG" ]; then
            KSIZE=$(stat -c%s "$KIMG")
            echo "kernel image: $KIMG ($KSIZE bytes)"
            [ "$KSIZE" -le 12582912 ] || { echo "ERROR: 内核镜像超过 12MB 上限"; exit 1; }
          fi

          # 3) manifest 必须包含关键包，杜绝“构建成功但缺 NSS/代理/DNS”的废固件
          MANIFEST=$(find "$BIN" -maxdepth 1 -type f -name "*.manifest" | head -n 1)
          [ -n "$MANIFEST" ] || { echo "ERROR: 未找到 .manifest"; exit 1; }
          for pkg in kmod-qca-nss-drv kmod-qca-nss-ecm nikki luci-app-nikki luci-app-oxidns luci-theme-kucat luci-app-samba4 kmod-tun kmod-nft-tproxy kmod-sched-bpf; do
            if grep -qE "^${pkg}( |\$)" "$MANIFEST"; then echo "OK:   pkg $pkg"; else echo "FAIL: pkg $pkg 缺失"; exit 1; fi
          done
          for pkg in mihomo luci-app-kucat-config dnsmasq-full kmod-zram zram-swap; do
            if grep -qE "^${pkg}( |\$)" "$MANIFEST"; then echo "OK:   pkg $pkg"; else echo "WARN: pkg $pkg 未在 manifest(可接受)"; fi
          done
          echo "===== 编译产物闸门校验通过 ====="

      - name: Collect Artifacts
        run: |
          cd "$WRT_DIR"
          mkdir -p upload
          cp -f .config "upload/config_${DEVICE_NAME}_${WRT_DATE}.seed" 2>/dev/null || true
          if [ "${{ inputs.TEST }}" != "true" ]; then
            KERNEL_VER=$(grep -oP '^kernel - \K[\d\.]+' ./bin/targets/qualcommax/ipq60xx/*.manifest 2>/dev/null | head -n 1 || echo "6.12")
            echo "KERNEL_VERSION=$KERNEL_VER" >> $GITHUB_ENV
            for file in $(find ./bin/targets/qualcommax/ipq60xx/ -type f \( -name "*jdcloud_re-ss-01*.bin" -o -name "*jdcloud_re-ss-01*.tar" \)); do
              cp -f "$file" "upload/qf-${WRT_DATE}-$(basename "$file")"
            done
          fi
          ls -lh upload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qf-${{ env.DEVICE_NAME }}-${{ env.WRT_DATE }}
          path: ${{ env.WRT_DIR }}/upload
          retention-days: 90

      - name: Publish Rolling Release
        if: ${{ inputs.TEST != true && inputs.RELEASE != false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$WRT_DIR"
          gh release create latest-qf --title "AX1800Pro 最新构建 (rolling)" \
            --notes "基于 LiBwrt/LibWrt ${REPO_BRANCH} @ ${WRT_HASH}，Linux ${KERNEL_VERSION}，构建于 ${BUILD_DAY}" \
            upload/* 2>/dev/null || gh release upload latest-qf upload/* --clobber
