# ==============================================================================
# 京东云亚瑟 (AX1800 Pro / RE-SS-01) 极致稳定固件云端自动化编译流水线
# 目标：LiBwrt/openwrt-6.x (25.12-nss) / Linux 6.12 / NSS ECM 内核满血加速
# 特性：MosDNS v5 + Nikki (Mihomo) + Samba4 + OpenList2 + NAT66 策略路由
# ==============================================================================

name: Build JDC AX1800 Pro Ultimate Firmware

on:
  workflow_dispatch:
    inputs:
      TEST:
        description: '仅生成配置文件与校验依赖，不执行耗时全量编译 (true/false)'
        default: 'false'
        required: false
        type: boolean
  push:
    paths:
      - 'configs/**'
      - 'scripts/**'
      - 'files/**'
      - '.github/workflows/Build-Firmware.yml'

permissions: write-all

env:
  WRT_REPO: https://github.com/LiBwrt/openwrt-6.x.git
  WRT_BRANCH: 25.12-nss
  DEVICE_NAME: jdcloud_re-ss-01
  WRT_IP: 10.0.0.1
  WRT_NAME: qf
  WRT_SSID: qf
  WRT_WORD: 8765432101
  WRT_THEME: kucat
  WRT_DIR: wrt

jobs:
  build:
    name: Build AX1800 Pro Firmware
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v2
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/share/chromium /usr/local/share/powershell"
          testing: false

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -yqq update
          sudo -E apt-get -yqq full-upgrade
          sudo -E apt-get -yqq install ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler dos2unix fastjar flex \
            gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp \
            nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
            vim wget xmlto xxd zlib1g-dev zstd libfuse-dev jq bc clang llvm
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          echo "WRT_DATE=$(TZ=Asia/Shanghai date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
          echo "BUILD_DAY=$(TZ=Asia/Shanghai date +'%Y.%m.%d')" >> $GITHUB_ENV

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Clone OpenWrt Source
        run: |
          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" "$WRT_DIR"
          cd "$WRT_DIR"
          echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # 清理海外 runner 易超时的国内镜像重定向
          if [ -f "./scripts/projectsmirrors.json" ]; then
            sed -i '/\.cn\//d; /tencent/d; /aliyun/d' "./scripts/projectsmirrors.json"
          fi

      - name: Merge Custom Files & Rules
        run: |
          cd "$WRT_DIR"
          # 确保脚本换行符为 LF 并赋执行权限
          find "$GITHUB_WORKSPACE/scripts" -type f -exec dos2unix {} \; -exec chmod +x {} \;
          find "$GITHUB_WORKSPACE/files" -type f -exec dos2unix {} \;
          # rootfs 内可执行脚本必须 +x（init.d / hotplug.d / uci-defaults / usr/sbin）
          for d in "$GITHUB_WORKSPACE/files/etc/init.d" "$GITHUB_WORKSPACE/files/etc/hotplug.d" "$GITHUB_WORKSPACE/files/etc/uci-defaults" "$GITHUB_WORKSPACE/files/usr/sbin" "$GITHUB_WORKSPACE/files/usr/bin"; do
            [ -d "$d" ] && find "$d" -type f -exec chmod +x {} \;
          done

          # 拷贝预置 rootfs 配置文件
          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            mkdir -p files
            cp -rf "$GITHUB_WORKSPACE/files/." files/
            echo "[INFO] Custom files/ merged into OpenWrt rootfs"
          fi

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WRT_DIR }}/.ccache
            ${{ env.WRT_DIR }}/staging_dir
          key: ${{ runner.os }}-ipq60xx-${{ env.WRT_BRANCH }}-${{ hashFiles('configs/**', 'scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-ipq60xx-${{ env.WRT_BRANCH }}-
            ${{ runner.os }}-ipq60xx-

      - name: Update & Install Feeds
        run: |
          cd "$WRT_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare Custom Packages & Clean Duplicate Packages
        run: |
          cd "$WRT_DIR"
          bash "$GITHUB_WORKSPACE/scripts/01-prepare-packages.sh"

      - name: Generate Config & Apply Custom Settings
        run: |
          set -eo pipefail
          cd "$WRT_DIR"

          # 1. 载入公共函数库并生成 .config（内部含关键补丁断言，失败即终止）
          source "$GITHUB_WORKSPACE/scripts/function.sh"
          generate_config

          # 2. 应用底层驱动补丁与出厂参数固化
          bash "$GITHUB_WORKSPACE/scripts/02-custom-settings.sh"

          # 3. 展开配置
          make defconfig -j$(nproc)

          # 4. defconfig 后硬断言闸门（吸取 NatserverWrt 企业级流水线经验）
          #    HARD 关键符号缺失 -> 立即终止；SOFT 符号缺失 -> 告警但仍继续
          echo "===== defconfig 配置闸门校验 ====="
          fail=0
          hard() { if grep -qE "$1" .config; then echo "OK:   $1"; else echo "FAIL: $1"; fail=1; fi; }
          soft() { if grep -qE "$1" .config; then echo "OK:   $1"; else echo "WARN: $1 (可接受, 继续)"; fi; }

          # --- HARD：机型 / 内存 Profile / 加速 / 核心插件 / 主题 / 透明代理 ---
          hard '^CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y'
          hard '^CONFIG_IPQ_MEM_PROFILE_1024=y'
          hard '^CONFIG_ATH11K_MEM_PROFILE_1G=y'
          hard '^CONFIG_DEVEL=y'
          hard '^CONFIG_PACKAGE_kmod-qca-nss-drv=y'
          hard '^CONFIG_PACKAGE_kmod-qca-nss-ecm=y'
          hard '^CONFIG_PACKAGE_luci-app-mosdns=y'
          hard '^CONFIG_PACKAGE_mosdns=y'
          hard '^CONFIG_PACKAGE_luci-app-nikki=y'
          hard '^CONFIG_PACKAGE_nikki=y'
          hard '^CONFIG_PACKAGE_luci-theme-kucat=y'
          hard '^CONFIG_PACKAGE_kmod-tun=y'
          hard '^CONFIG_PACKAGE_kmod-nft-tproxy=y'

          # --- SOFT：增强项（缺失不致命）---
          soft '^CONFIG_KERNEL_DEBUG_INFO=y'
          soft '^CONFIG_KERNEL_DEBUG_INFO_BTF=y'
          soft '^CONFIG_PACKAGE_mihomo-meta=y'
          soft '^CONFIG_PACKAGE_luci-app-kucat-config=y'
          soft '^CONFIG_PACKAGE_kmod-nft-fullcone=y'
          soft '^CONFIG_PACKAGE_dnsmasq-full=y'
          soft '^CONFIG_PACKAGE_kmod-zram=y'

          # 必须没有 Argon/Aurora 主题残留：硬性要求
          if grep -qE '^CONFIG_PACKAGE_luci-theme-(argon|aurora)=y' .config; then echo "FAIL: 检测到多余主题(Argon/Aurora)"; fail=1; else echo "OK:   无 Argon/Aurora 多余主题"; fi
          # 内核镜像上限必须为 12MB：硬性要求
          if sed -n '/^define Device\/jdcloud_re-ss-01$/,/^endef$/p' target/linux/qualcommax/image/ipq60xx.mk | grep -q 'KERNEL_SIZE := 12288k'; then echo "OK:   RE-SS-01 KERNEL_SIZE=12288k"; else echo "FAIL: RE-SS-01 KERNEL_SIZE != 12288k"; fail=1; fi
          [ "$fail" -eq 0 ] || { echo "ERROR: defconfig 后关键配置丢失, 中止构建" >&2; exit 1; }
          echo "===== 闸门校验通过 ====="

      - name: Download Package Sources
        if: ${{ inputs.TEST != true }}
        run: |
          cd "$WRT_DIR"
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        if: ${{ inputs.TEST != true }}
        run: |
          cd "$WRT_DIR"
          echo -e "[INFO] 开始并发编译 (核数: $(nproc))..."
          make -j$(nproc) || make -j1 V=s
          echo "COMPILE_SUCCESS=true" >> $GITHUB_ENV

      - name: Post-Build Assertions (Fail-Fast)
        if: ${{ inputs.TEST != true }}
        run: |
          set -e
          cd "$WRT_DIR"
          BIN=./bin/targets/qualcommax/ipq60xx
          echo "===== 编译产物闸门校验 (post-build) ====="

          # 1) 内核镜像存在时必须不超过 12MB（防止 eBPF/BTF 膨胀导致 FIT 溢出）
          KIMG=$(find "$BIN" -maxdepth 1 -type f \( -name "*-kernel.bin" -o -name "*-uImage" -o -name "kernel" \) | head -n 1)
          if [ -z "$KIMG" ]; then
            echo "WARN: 未找到独立内核镜像(可能 FIT 打包), 跳过内核尺寸校验"
          else
            KSIZE=$(stat -c%s "$KIMG")
            echo "kernel image: $KIMG ($KSIZE bytes)"
            [ "$KSIZE" -le 12582912 ] || { echo "ERROR: 内核镜像超过 12MB 上限"; exit 1; }
          fi

          # 2) 产物 manifest 必须包含关键包，杜绝"构建成功但缺 NSS/代理/DNS"的废固件
          MANIFEST=$(find "$BIN" -maxdepth 1 -type f -name "*.manifest" | head -n 1)
          [ -n "$MANIFEST" ] || { echo "ERROR: 未找到 .manifest, 无法校验包完整性"; exit 1; }
          echo "manifest: $MANIFEST"
          # HARD：LiBwrt/OpenWrt 实际包名（NSS 内核模块统一带 kmod- 前缀）
          for pkg in kmod-qca-nss-drv kmod-qca-nss-ecm mosdns nikki luci-app-mosdns luci-app-nikki luci-theme-kucat kmod-tun kmod-nft-tproxy; do
            if grep -qE "^${pkg}( |\$)" "$MANIFEST"; then echo "OK:   pkg $pkg"; else echo "FAIL: pkg $pkg 缺失"; exit 1; fi
          done
          # SOFT：可变包名，仅告警
          for pkg in mihomo mihomo-meta luci-app-kucat-config dnsmasq-full kmod-zram zram-swap; do
            if grep -qE "^${pkg}( |\$)" "$MANIFEST"; then echo "OK:   pkg $pkg"; else echo "WARN: pkg $pkg 未在 manifest(可接受)"; fi
          done

          # 3) 必须产出 RE-SS-01 的 sysupgrade 镜像
          ls "$BIN"/*jdcloud_re-ss-01*sysupgrade* >/dev/null 2>&1 || { echo "ERROR: 未生成 sysupgrade 镜像"; exit 1; }
          echo "===== 编译产物闸门校验通过 ====="

      - name: Package Firmware & Artifacts
        run: |
          cd "$WRT_DIR"
          mkdir -p upload

          # 备份生成使用的 .config
          cp -f .config upload/config_qf_${{ env.DEVICE_NAME }}_${{ env.WRT_DATE }}.seed

          # 注意：包含用户节点凭据的 MosDNS/Nikki 配置还原包不在 CI 中打包/发布，
          # 改为本地私有目录 D:\ai\qf-private\configs-restore 单独交付，杜绝凭据泄露。

          if [ "${{ inputs.TEST }}" != "true" ]; then
            # 提取 Linux 内核版本
            KERNEL_VER=$(find ./bin/targets/qualcommax/ipq60xx/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \; | head -n 1 || echo "6.12")
            echo "KERNEL_VERSION=$KERNEL_VER" >> $GITHUB_ENV

            # 整理针对 jdcloud_re-ss-01 的刷机固件，统一冠以 qf 专属命名
            for file in $(find ./bin/targets/qualcommax/ipq60xx/ -type f \( -name "*jdcloud_re-ss-01*.bin" -o -name "*jdcloud_re-ss-01*.tar" \)); do
              filename=$(basename "$file")
              cp -f "$file" "upload/qf-${{ env.WRT_DATE }}-${filename}"
            done
          fi

          ls -lh upload/

      - name: Upload Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: qf-AX1800PRO-Firmware-${{ env.WRT_DATE }}
          path: ${{ env.WRT_DIR }}/upload/*

      - name: Publish GitHub Release
        if: ${{ inputs.TEST != true && env.COMPILE_SUCCESS == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qf-v${{ env.BUILD_DAY }}_${{ env.WRT_DATE }}
          files: ${{ env.WRT_DIR }}/upload/*
          name: qf - 京东云亚瑟 (AX1800 Pro) 极致稳定满血版 [${{ env.BUILD_DAY }}]
          body: |
            ### 🚀 qf - 京东云亚瑟 (AX1800 Pro / RE-SS-01) 极致稳定固件

            - **底包架构**：`LiBwrt/openwrt-6.x` (`25.12-nss` 分支 / Linux ${{ env.KERNEL_VERSION }} 内核 / 原生 firewall4 nftables)
            - **源码提交**：${{ env.WRT_HASH }}
            - **编译时间**：${{ env.WRT_DATE }}
            - **专属适配**：高通 IPQ6000 + 硬改 1GB DDR4 RAM + 2GB 大分区 rootfs

            #### 💎 核心架构与功能特性
            1. **高通 NSS 硬件加速**：内核底层直挂 `kmod-qca-nss-drv` 与 `kmod-qca-nss-ecm` (QSDK 12.5)，千兆全速转发不吃 CPU，已剔除前端 Web 负担。
            2. **DNS 分流与去广告**：集成 MosDNS v5，国内阿里 DoH 直连 (放行 IPv6)；国外 NextDNS 专属入口 + Google/Cloudflare DoH 400ms 超时抢跑，全链路拒答 AAAA (0 泄漏)，结合 RFC 8767 乐观缓存秒级解析。
            3. **科学代理**：集成 Nikki (Mihomo)，支持 TUN/TPROXY，大陆 IP 直连走 NSS 硬件加速，海外走代理通道。
            4. **网络与 IPv6**：出厂预设 WAN NAT66 (`masq6=1`) 与 LAN ULA (`fdae:1800:1::/48`)，搭载 `99-nat66-policy` 动态策略路由，破除电信 source-specific 断流。
            5. **轻量存储扩展**：集成 Samba4、OpenList2 与 USB 存储挂载栈，外接硬盘自动即插即用。
            6. **外观与交互**：出厂搭载极客风 Kucat 猫咪主题 (`sirpdboy/luci-theme-kucat`)，系统内**仅保留 Kucat 单一主题**并已对配置面板做防连点加固；彻底剔除 Tailscale、EasyTier、PushBot、Diskman、SQM 及 Argon / Aurora 冗余主题。

            #### 📋 出厂默认参数
            - **固件名称/主机名**：`qf`
            - **后台管理地址**：`http://10.0.0.1`
            - **管理账号/密码**：`root` / 无密码
            - **默认 Wi-Fi 名称**：`qf`
            - **默认 Wi-Fi 密码**：`8765432101` (国家码锁定 AU 兼顾覆盖与温控)
            - **默认主题**：`Kucat` (猫咪主题)
